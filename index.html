<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>د صرافۍ او حسابونو (کتابچې) جامع سسټم</title>
    <!-- HTML2PDF CDN for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 10px; }
        
        /* Top Navigation Menu */
        .navbar { display: flex; background: #0f172a; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .nav-btn { flex: 1; padding: 12px 5px; color: #cbd5e1; background: none; border: none; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center; }
        .nav-btn.active { background: #2563eb; color: #ffffff; }

        .card { background: #ffffff; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .card h2 { font-size: 1.1rem; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 12px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        
        .btn { width: 100%; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-primary { background-color: #2563eb; }
        .btn-success { background-color: #16a34a; }
        .btn-pdf { background-color: #dc2626; width: auto; padding: 6px 12px; font-size: 0.8rem; }
        .btn-add { background-color: #0284c7; width: auto; padding: 6px 12px; font-size: 0.8rem; }
        
        .search-box { background: #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.8rem; }
        th, td { border: 1px solid #cbd5e1; padding: 6px; text-align: center; }
        th { background-color: #f8fafc; }
        
        .khata-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .khata-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 8px; }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-jama { background: #dcfce7; color: #15803d; }
        .badge-nama { background: #fee2e2; color: #b91c1c; }
        .action-btns { display: flex; gap: 5px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <!-- Main Navigation Menu -->
    <div class="navbar">
        <button class="nav-btn active" onclick="switchTab('khataTab', this)">📖 کتابچه (حسابونه)</button>
        <button class="nav-btn" onclick="switchTab('exchangeTab', this)">💱 اسعار بدلول</button>
        <button class="nav-btn" onclick="switchTab('hawalaTab', this)">💸 حوالې</button>
    </div>

    <!-- KHATA TAB -->
    <div id="khataTab" class="tab-content active">
        <!-- Search Bar -->
        <div class="search-box">
            <label>🔍 د حسابونو لټون (نوم، تاریخ، یا تفصیل):</label>
            <input type="text" id="searchInput" oninput="searchData()" placeholder="دلته یې وټایپ کړئ...">
        </div>

        <!-- Add New Khata Form -->
        <div class="card">
            <h2>➕ د نوي سړي کتابچه (حساب خلاصول)</h2>
            <div class="form-group">
                <label>د پریدونکي (مشتري) پوره نوم:</label>
                <input type="text" id="newKhataName" placeholder="مثلاً: احمد خان">
            </div>
            <div class="form-group">
                <label>د تلیفون شمیره / ولایت:</label>
                <input type="text" id="newKhataPhone" placeholder="مثلاً: 0780000000">
            </div>
            <button class="btn btn-success" onclick="createKhata()">نوی حساب خلاص کړئ</button>
        </div>

        <!-- All Khatas List -->
        <div class="card">
            <h2>📚 د ټولو خلکو کتابچې</h2>
            <div id="khataContainer">
                <!-- Khata records load here -->
            </div>
        </div>
    </div>

    <!-- EXCHANGE CALCULATOR TAB -->
    <div id="exchangeTab" class="tab-content">
        <div class="card">
            <h2>💱 د اسعارو بدلولو محاسبه</h2>
            <div class="form-group">
                <label>مبلغ (مقدار):</label>
                <input type="number" id="calcAmount" placeholder="100">
            </div>
            <div class="form-group">
                <label>نرخ (Rate):</label>
                <input type="number" id="calcRate" placeholder="70.5">
            </div>
            <button class="btn btn-primary" onclick="calculateExchange()">حساب کړئ</button>
            <h3 id="calcResult" style="margin-top:10px; color:#2563eb; text-align:center;"></h3>
        </div>
    </div>

    <!-- HAWALA TAB -->
    <div id="hawalaTab" class="tab-content">
        <div class="card">
            <h2>د نوي حوالې ثبتول</h2>
            <div class="form-group">
                <label>لیږونکی:</label>
                <input type="text" id="hSender" placeholder="نوم">
            </div>
            <div class="form-group">
                <label>ترلاسه کونکی:</label>
                <input type="text" id="hReceiver" placeholder="نوم">
            </div>
            <div class="form-group">
                <label>مبلغ او اسعار:</label>
                <input type="text" id="hAmount" placeholder="500 ډالر">
            </div>
            <button class="btn btn-primary" onclick="addHawala()">حواله ثبت کړئ</button>
            <div id="hawalaList" style="margin-top:15px;"></div>
        </div>
    </div>

    <script>
        // Storage logic
        let khatas = JSON.parse(localStorage.getItem('sarrafi_khatas_v2')) || [];
        let hawalas = JSON.parse(localStorage.getItem('sarrafi_hawalas_v2')) || [];

        function saveData() {
            localStorage.setItem('sarrafi_khatas_v2', JSON.stringify(khatas));
            localStorage.setItem('sarrafi_hawalas_v2', JSON.stringify(hawalas));
        }

        // Tab Switching
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Create Khata (With Duplicate Prevention)
        function createKhata() {
            let name = document.getElementById('newKhataName').value.trim();
            let phone = document.getElementById('newKhataPhone').value.trim();

            if (!name) {
                alert("مهرباني وکړئ د سړي نوم ولیکئ!");
                return;
            }

            let exists = khatas.some(k => k.name.toLowerCase() === name.toLowerCase());
            if (exists) {
                alert("⚠️ په دې نوم دمخه حساب شتون لري! مهرباني وکړئ د نوم تر څنګ څه اضافي واچوئ.");
                return;
            }

            khatas.push({
                id: Date.now(),
                name: name,
                phone: phone || "مشخص شوی نه دی",
                entries: []
            });

            saveData();
            renderKhatas();
            document.getElementById('newKhataName').value = "";
            document.getElementById('newKhataPhone').value = "";
            alert("حساب خلاص شو!");
        }

        // Add Transaction Entry into Khata
        function addHisab(khataId) {
            let amount = prompt("مبلغ (مقدار) ولیکئ:");
            if (!amount || isNaN(amount)) return;

            let currency = prompt("اسعار (ډالر / افغانۍ / کلدارې):", "افغانۍ");
            let type = prompt("نوعیت:\n1 = جمع (اخیستنه)\n2 = نوم (وړل/قرض)", "1");
            let detail = prompt("تفصیل:", "د صرافۍ تبادله");
            let date = new Date().toLocaleDateString('fa-IR') + " " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            let khata = khatas.find(k => k.id === khataId);
            if (khata) {
                khata.entries.push({
                    id: Date.now(),
                    date: date,
                    amount: parseFloat(amount),
                    currency: currency,
                    type: type === "2" ? "نوم (ورکړه)" : "جمع (اخیستنه)",
                    detail: detail
                });
                saveData();
                renderKhatas();
            }
        }

        // Render Khatas
        function renderKhatas(filterText = "") {
            let container = document.getElementById('khataContainer');
            container.innerHTML = "";

            let filtered = khatas.filter(k => {
                let nameMatch = k.name.toLowerCase().includes(filterText.toLowerCase());
                let entryMatch = k.entries.some(e => 
                    e.detail.toLowerCase().includes(filterText.toLowerCase()) || 
                    e.date.includes(filterText) ||
                    e.amount.toString().includes(filterText)
                );
                return nameMatch || entryMatch;
            });

            if (filtered.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#64748b;'>هیڅ حساب ونه موندل شو.</p>";
                return;
            }

            filtered.forEach(k => {
                let html = `
                    <div class="khata-card" id="pdf-card-${k.id}">
                        <div class="khata-header">
                            <div>
                                <strong>👤 ${k.name}</strong> <br><small>📱 ${k.phone}</small>
                            </div>
                            <div class="action-btns">
                                <button class="btn btn-add" onclick="addHisab(${k.id})">➕ ثبتول</button>
                                <button class="btn btn-pdf" onclick="downloadPDF(${k.id}, '${k.name}')">📄 PDF</button>
                            </div>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>تاريخ</th>
                                    <th>نوعیت</th>
                                    <th>مبلغ</th>
                                    <th>اسعار</th>
                                    <th>تفصیل</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${k.entries.map(e => `
                                    <tr>
                                        <td>${e.date}</td>
                                        <td><span class="badge ${e.type.includes('جمع') ? 'badge-jama' : 'badge-nama'}">${e.type}</span></td>
                                        <td><b>${e.amount}</b></td>
                                        <td>${e.currency}</td>
                                        <td>${e.detail}</td>
                                    </tr>
                                `).join('')}
                                ${k.entries.length === 0 ? '<tr><td colspan="5">هیڅ راکړه ورکړه نشته</td></tr>' : ''}
                            </tbody>
                        </table>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // Search Function
        function searchData() {
            let text = document.getElementById('searchInput').value;
            renderKhatas(text);
        }

        // Download Khata as PDF
        function downloadPDF(khataId, khataName) {
            let element = document.getElementById(`pdf-card-${khataId}`);
            let opt = {
                margin:       8,
                filename:     `Khata_${khataName}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // Exchange Calculator
        function calculateExchange() {
            let amount = document.getElementById('calcAmount').value;
            let rate = document.getElementById('calcRate').value;
            if(amount && rate) {
                document.getElementById('calcResult').innerText = "مجموعه: " + (amount * rate).toFixed(2);
            }
        }

        // Hawala Logic
        function addHawala() {
            let sender = document.getElementById('hSender').value;
            let receiver = document.getElementById('hReceiver').value;
            let amount = document.getElementById('hAmount').value;
            if (sender && receiver && amount) {
                hawalas.push({ sender, receiver, amount, code: 'HW-' + Math.floor(10000 + Math.random() * 90000) });
                saveData();
                renderHawalas();
                document.getElementById('hSender').value = "";
                document.getElementById('hReceiver').value = "";
                document.getElementById('hAmount').value = "";
            }
        }

        function renderHawalas() {
            let div = document.getElementById('hawalaList');
            div.innerHTML = hawalas.map(h => `<p style="padding:6px; border-bottom:1px solid #ccc;"><b>${h.code}</b>: ${h.sender} ➔ ${h.receiver} (${h.amount})</p>`).join('');
        }

        // Initial rendering
        renderKhatas();
        renderHawalas();
    </script>
</body>
</html>
