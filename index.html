<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>د صرافۍ او حسابونو (کتابچې) جامع سسټم</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 12px; }
        .header { background: #0f172a; color: #fff; text-align: center; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .header h1 { font-size: 1.3rem; }
        .card { background: #ffffff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .card h2 { font-size: 1.1rem; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 12px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
        button { width: 100%; background-color: #2563eb; color: white; border: none; padding: 11px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
        button.btn-success { background-color: #16a34a; }
        button.btn-danger { background-color: #dc2626; }
        button:active { opacity: 0.85; }
        .search-box { background: #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.82rem; }
        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; }
        th { background-color: #f8fafc; }
        .khata-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .khata-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .badge-jama { background: #dcfce7; color: #15803d; }
        .badge-nama { background: #fee2e2; color: #b91c1c; }
        .flex-gap { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>د صرافۍ، تبادلې او حسابونو سسټم</h1>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
        <label>🔍 لټون (د نوم، تاریخ، یا تفصیل له مخې):</label>
        <input type="text" id="searchInput" oninput="searchData()" placeholder="دلته یې وټایپ کړئ...">
    </div>

    <!-- New Khata Creation -->
    <div class="card">
        <h2>➕ د نوي حساب (کتابچې) خلاصول</h2>
        <div class="form-group">
            <label>د پریدونکي (مشتري) مکمل نوم:</label>
            <input type="text" id="newKhataName" placeholder="مثلاً: احمد خان">
        </div>
        <div class="form-group">
            <label>د تلیفون شمیره / ولایت:</label>
            <input type="text" id="newKhataPhone" placeholder="مثلاً: 0780000000">
        </div>
        <button class="btn-success" onclick="createKhata()">نوی حساب خلاص کړئ</button>
    </div>

    <!-- Exchange Calculator -->
    <div class="card">
        <h2>💱 د اسعارو بدلول (Exchange Calculator)</h2>
        <div class="flex-gap">
            <div class="form-group" style="flex:1;">
                <label>مبلغ:</label>
                <input type="number" id="calcAmount" placeholder="100">
            </div>
            <div class="form-group" style="flex:1;">
                <label>نرخ (Rate):</label>
                <input type="number" id="calcRate" placeholder="70.5">
            </div>
        </div>
        <button onclick="calculateExchange()">حساب کړئ</button>
        <h3 id="calcResult" style="margin-top:10px; color:#2563eb; text-align:center;"></h3>
    </div>

    <!-- Khata List and Hisab Entry -->
    <div class="card">
        <h2>📚 د پیرودونکو حسابونه (کتابچه)</h2>
        <div id="khataContainer">
            <!-- Khatas will load dynamically -->
        </div>
    </div>

    <script>
        // Load stored data or initialize
        let khatas = JSON.parse(localStorage.getItem('sarrafi_khatas')) || [];

        function saveToStorage() {
            localStorage.setItem('sarrafi_khatas', JSON.stringify(khatas));
        }

        // Create New Khata with Duplicate Check
        function createKhata() {
            let nameInput = document.getElementById('newKhataName').value.trim();
            let phoneInput = document.getElementById('newKhataPhone').value.trim();

            if (!nameInput) {
                alert("مهرباني وکړئ د پریدونکي نوم ولیکئ!");
                return;
            }

            // Check if Khata with same name already exists
            let exists = khatas.some(k => k.name.toLowerCase() === nameInput.toLowerCase());
            if (exists) {
                alert("⚠️ په دې نوم دمخه حساب شتون لري! لطفا د نوم تر څنګ څه اضافی کلمه یا شمیره ولیکئ.");
                return;
            }

            let newKhata = {
                id: Date.now(),
                name: nameInput,
                phone: phoneInput || "نه دی درج شوی",
                entries: []
            };

            khatas.push(newKhata);
            saveToStorage();
            renderKhatas();

            document.getElementById('newKhataName').value = "";
            document.getElementById('newKhataPhone').value = "";
            alert("حساب په بریالیتوب سره خلاص شو!");
        }

        // Add Transaction/Hisab into a Khata
        function addHisab(khataId) {
            let amount = prompt("مبلغ (مقدار) ولیکئ:");
            if (!amount || isNaN(amount)) return;

            let currency = prompt("اسعار ولیکئ (ډالر / افغانۍ / کلدارې):", "افغانۍ");
            let type = prompt("نوعیت انتخاب کړئ:\n 1 د 'جمع' (جمع کول) لپاره\n 2 د 'نوم' (وړل/قرض) لپاره", "1");
            let detail = prompt("تفصیل / تفصیلات ولیکئ:", "د صرافۍ حساب");
            let date = new Date().toLocaleDateString('fa-IR') + " " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            let khata = khatas.find(k => k.id === khataId);
            if (khata) {
                khata.entries.push({
                    id: Date.now(),
                    date: date,
                    amount: parseFloat(amount),
                    currency: currency,
                    type: type === "2" ? "نوم (ورکړه)" : "جمع (اخیستنه)",
                    detail: detail
                });
                saveToStorage();
                renderKhatas();
            }
        }

        // Render Khatas
        function renderKhatas(filterText = "") {
            let container = document.getElementById('khataContainer');
            container.innerHTML = "";

            let filtered = khatas.filter(k => {
                let nameMatch = k.name.toLowerCase().includes(filterText.toLowerCase());
                let entryMatch = k.entries.some(e => 
                    e.detail.toLowerCase().includes(filterText.toLowerCase()) || 
                    e.date.includes(filterText) ||
                    e.amount.toString().includes(filterText)
                );
                return nameMatch || entryMatch;
            });

            if (filtered.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#64748b;'>هیڅ حساب وانخیستل شو.</p>";
                return;
            }

            filtered.forEach(k => {
                let html = `
                    <div class="khata-item">
                        <div class="khata-header">
                            <div>
                                <strong>👤 ${k.name}</strong> <small>(${k.phone})</small>
                            </div>
                            <button style="width:auto; padding:5px 10px; font-size:0.8rem;" onclick="addHisab(${k.id})">➕ نوی حساب ثبتول</button>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>تاريخ</th>
                                    <th>نوعیت</th>
                                    <th>مبلغ</th>
                                    <th>اسعار</th>
                                    <th>تفصیل</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${k.entries.map(e => `
                                    <tr>
                                        <td>${e.date}</td>
                                        <td><span class="badge ${e.type.includes('جمع') ? 'badge-jama' : 'badge-nama'}">${e.type}</span></td>
                                        <td><b>${e.amount}</b></td>
                                        <td>${e.currency}</td>
                                        <td>${e.detail}</td>
                                    </tr>
                                `).join('')}
                                ${k.entries.length === 0 ? '<tr><td colspan="5">تر اوسه هیڅ راکړه ورکړه نه ده ثبت شوې.</td></tr>' : ''}
                            </tbody>
                        </table>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // Search Function
        function searchData() {
            let text = document.getElementById('searchInput').value;
            renderKhatas(text);
        }

        // Exchange Calculator
        function calculateExchange() {
            let amount = document.getElementById('calcAmount').value;
            let rate = document.getElementById('calcRate').value;
            if(amount && rate) {
                let total = amount * rate;
                document.getElementById('calcResult').innerText = "مجموعه: " + total.toFixed(2);
            } else {
                document.getElementById('calcResult').innerText = "مهرباني وکړئ دواړه خانې ډکې کړئ.";
            }
        }

        // Initial render
        renderKhatas();
    </script>
</body>
</html>
